name: Build and Release / 云端打包发布

on:
  workflow_dispatch:
    inputs:
      require_signing:
        description: "正式发布：强制要求 Windows/Apple 数字签名与 macOS 公证"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: 检查源码与版本
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: 检查必需文件并读取版本
        id: version
        shell: bash
        run: |
          set -euo pipefail
          for f in Page_Operations_Monitor.py PageOperationsMonitor.ico PageOperationsMonitor.icns README.md tools/windows_deployer.py; do
            test -f "$f" || { echo "缺少必需文件: $f"; exit 1; }
          done
          VERSION=$(python - <<'PY'
          import re
          from pathlib import Path
          t=Path('Page_Operations_Monitor.py').read_text(encoding='utf-8-sig')
          m=re.search(r'APP_VERSION\s*=\s*["\']v?(\d+\.\d+\.\d+)["\']',t)
          if not m: raise SystemExit('主程序找不到 APP_VERSION')
          print(m.group(1))
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "准备构建 v$VERSION"

  windows:
    name: Windows x64 云端构建
    needs: validate
    runs-on: windows-latest
    env:
      REQUIRE_SIGNING: ${{ inputs.require_signing }}
      WINDOWS_CERT_PFX_B64: ${{ secrets.WINDOWS_CERT_PFX_B64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装构建依赖
        run: python -m pip install --upgrade "setuptools==84.0.0" "pyinstaller==6.22.3" "pyinstaller-hooks-contrib==2026.8" "PyQt6==6.11.0" "PyQt6-Qt6==6.11.2" "PyQt6-sip==13.13.0" "playwright==1.64.0" "pyee==14.0.0" "greenlet==3.5.6" "Pillow==12.3.0"
      - name: 构建 Windows 自定义部署器
        run: python tools/cloud_build.py --target windows-x64
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: cloud-release/*.exe
          if-no-files-found: error
          retention-days: 7

  mac_arm64:
    name: macOS Apple Silicon / arm64
    needs: validate
    runs-on: macos-15
    env:
      REQUIRE_SIGNING: ${{ inputs.require_signing }}
      APPLE_APP_CERT_P12_B64: ${{ secrets.APPLE_APP_CERT_P12_B64 }}
      APPLE_APP_CERT_PASSWORD: ${{ secrets.APPLE_APP_CERT_PASSWORD }}
      APPLE_INSTALLER_CERT_P12_B64: ${{ secrets.APPLE_INSTALLER_CERT_P12_B64 }}
      APPLE_INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERT_PASSWORD }}
      APPLE_APP_SIGN_IDENTITY: ${{ secrets.APPLE_APP_SIGN_IDENTITY }}
      APPLE_INSTALLER_SIGN_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装构建依赖
        run: python -m pip install --upgrade "setuptools==84.0.0" "pyinstaller==6.22.3" "pyinstaller-hooks-contrib==2026.8" "PyQt6==6.11.0" "PyQt6-Qt6==6.11.2" "PyQt6-sip==13.13.0" "playwright==1.64.0" "pyee==14.0.0" "greenlet==3.5.6" "Pillow==12.3.0"
      - name: 构建 macOS arm64 PKG
        run: python tools/cloud_build.py --target macos-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: cloud-release/*.pkg
          if-no-files-found: error
          retention-days: 7

  mac_x64:
    name: macOS Intel / x64
    needs: validate
    runs-on: macos-15-intel
    env:
      REQUIRE_SIGNING: ${{ inputs.require_signing }}
      APPLE_APP_CERT_P12_B64: ${{ secrets.APPLE_APP_CERT_P12_B64 }}
      APPLE_APP_CERT_PASSWORD: ${{ secrets.APPLE_APP_CERT_PASSWORD }}
      APPLE_INSTALLER_CERT_P12_B64: ${{ secrets.APPLE_INSTALLER_CERT_P12_B64 }}
      APPLE_INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERT_PASSWORD }}
      APPLE_APP_SIGN_IDENTITY: ${{ secrets.APPLE_APP_SIGN_IDENTITY }}
      APPLE_INSTALLER_SIGN_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装构建依赖
        run: python -m pip install --upgrade "setuptools==84.0.0" "pyinstaller==6.22.3" "pyinstaller-hooks-contrib==2026.8" "PyQt6==6.11.0" "PyQt6-Qt6==6.11.2" "PyQt6-sip==13.13.0" "playwright==1.64.0" "pyee==14.0.0" "greenlet==3.5.6" "Pillow==12.3.0"
      - name: 构建 macOS x64 PKG
        run: python tools/cloud_build.py --target macos-x64
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: cloud-release/*.pkg
          if-no-files-found: error
          retention-days: 7

  release:
    name: 组装三个用户下载包并发布
    permissions:
      contents: write
    needs: [validate, windows, mac_arm64, mac_x64]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: artifacts
          merge-multiple: false
      - name: 组装三个最终 ZIP
        run: python tools/assemble_release.py
      - name: 检查最终附件数量
        shell: bash
        run: |
          set -euo pipefail
          test -f "final-release/ProfessionalMonitorTool-${VERSION}-windows-x64.zip"
          test -f "final-release/ProfessionalMonitorTool-${VERSION}-macos-arm64.zip"
          test -f "final-release/ProfessionalMonitorTool-${VERSION}-macos-x64.zip"
          COUNT=$(find final-release -maxdepth 1 -type f | wc -l | tr -d ' ')
          test "$COUNT" = "3" || { echo "应该只有 3 个 Release 文件，实际 $COUNT"; exit 1; }
      - name: 创建或更新 Release
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "专业监控工具 v${VERSION}" --notes-file release-meta/RELEASE_NOTES.md
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | while IFS= read -r asset; do
              [ -n "$asset" ] || continue
              gh release delete-asset "$TAG" "$asset" --repo "$GITHUB_REPOSITORY" -y
            done
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "专业监控工具 v${VERSION}" --notes-file release-meta/RELEASE_NOTES.md --latest
          fi
          gh release upload "$TAG" final-release/*.zip --repo "$GITHUB_REPOSITORY" --clobber
