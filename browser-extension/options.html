<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POM Connector - Auto Connect</title><link rel="stylesheet" href="ui.css"></head>
<body><main class="settings"><header><img src="icons/icon128.png" alt="Connector" width="56" height="56"><div><h1 id="heading"></h1><p id="subtitle"></p></div><b class="version">1.3.0 AUTO</b></header>
<div id="status" class="status"></div><section><h2 id="connectHeading"></h2><p id="autoNote"></p><div class="actions"><button id="reconnect" class="primary"></button><button id="disconnect" class="secondary"></button></div><p id="endpoint" class="muted"></p></section>
<section><h2 id="profileHeading"></h2><label><span id="nameLabel"></span><input id="profile_name" maxlength="80"></label><p id="nameNote" class="muted"></p>
<details><summary id="advancedTitle"></summary><div class="grid"><label><span id="channelLabel"></span><select id="channel_label"><option value="" id="channelUnknown"></option><option value="Chrome Stable">Chrome Stable</option><option value="Chrome Beta">Chrome Beta</option><option value="Chrome Dev">Chrome Dev</option><option value="Chromium">Chromium</option></select></label><label><span id="dirLabel"></span><input id="profile_directory" maxlength="100" placeholder="Profile 201"></label></div>
<label><span id="pathLabel"></span><input id="profile_path" maxlength="800" spellcheck="false" placeholder="C:\Users\DELL\AppData\Local\Google\Chrome\User Data\Profile 201"></label><p id="pathNote" class="muted"></p><button id="openVersion" class="secondary"></button></details>
<div class="actions"><button id="save" class="primary"></button></div></section>
<section class="privacy"><h2 id="privacyHeading"></h2><p id="privacyText"></p><code id="instance"></code><div class="actions"><button id="reset" class="danger"></button></div></section><footer id="footer"></footer></main><script src="options.js"></script></body></html>
